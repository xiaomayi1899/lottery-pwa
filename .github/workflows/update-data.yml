name: 每日开奖数据更新

on:
  schedule:
    # 北京时间 21:40 / 22:10，覆盖双色球（二/四/日 21:15）与大乐透（一/三/六 21:25）开奖
    - cron: "40 13 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取最新数据
        run: python update_data.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "开奖数据更新 $(date -u +%F)" && git push)
